<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touching Sounds</title>
  <script defer src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --ink: #172c26;
      --light: #9bbc0f;
      --mid: #8bac0f;
      --dark: #306230;
      --cream: #f3ecc7;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--ink);
      color: var(--ink);
      font-family: "Courier New", monospace;
    }

    button {
      min-height: 44px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: inherit;
      font-weight: 900;
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .hidden { display: none !important; }

    .screen {
      min-height: 100vh;
      padding: clamp(10px, 2vw, 22px);
      background:
        repeating-linear-gradient(0deg, rgba(23,44,38,.08) 0 2px, transparent 2px 4px),
        var(--light);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      min-height: 36px;
      padding: 6px 10px;
      border: 3px solid var(--ink);
      background: var(--cream);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      margin-right: 7px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: #d8af37;
    }

    .status.connected .status-dot { background: #31a55a; }
    .status.disconnected .status-dot { background: #b84a48; }

    .status-row button {
      margin-left: auto;
      padding: 6px 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 42px);
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 var(--dark);
    }

    /* Computer */
    .computer-layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 18px;
    }

    .side-panel,
    .main-panel {
      border: 5px solid var(--ink);
      box-shadow: 8px 8px 0 var(--dark);
    }

    .side-panel {
      min-height: 560px;
      padding: 14px;
      background: var(--mid);
    }

    #qr {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1;
      margin: 14px 0;
      padding: 8px;
      border: 4px solid var(--ink);
      background: white;
    }

    #qr canvas, #qr img {
      max-width: 100%;
      height: auto !important;
    }

    #startSound {
      width: 100%;
    }

    #joinUrl {
      display: block;
      max-width: 100%;
      margin-top: 12px;
      overflow: hidden;
      color: var(--ink);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .roster {
      display: grid;
      gap: 7px;
      margin-top: 14px;
    }

    .player-card {
      min-height: 38px;
      padding: 8px;
      border: 3px solid var(--ink);
      background: var(--cream);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      border: 2px solid var(--ink);
      vertical-align: -3px;
    }

    .main-panel {
      min-width: 0;
      background: var(--ink);
    }

    .canvas-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 54px;
      padding: 8px 12px;
      color: var(--light);
      background: var(--ink);
    }

    #canvasWrap {
      border-top: 4px solid var(--ink);
      background: var(--light);
    }

    #sequencer {
      display: block;
      width: 100%;
      height: clamp(360px, 68vh, 620px);
    }

    /* Player */
    .phone-screen {
      max-width: 620px;
      margin: 0 auto;
    }

    .phone-card {
      border: 5px solid var(--ink);
      background: var(--mid);
      box-shadow: 7px 7px 0 var(--dark);
    }

    .identity {
      display: grid;
      grid-template-columns: 76px 1fr;
      align-items: center;
      gap: 12px;
      min-height: 104px;
      padding: 12px;
      border-bottom: 4px solid var(--ink);
    }

    #identitySwatch {
      width: 76px;
      height: 76px;
      border: 4px solid var(--ink);
      background: var(--cream);
    }

    .identity h2 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    .identity p {
      margin: 3px 0;
      font-size: 13px;
      font-weight: 900;
    }

    .phone-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px;
    }

    .phone-tools button { width: 100%; }

    .phone-grid-wrap {
      overflow-x: auto;
      padding: 14px;
      border-top: 4px solid var(--ink);
      background: var(--ink);
      scrollbar-color: var(--light) var(--ink);
      overscroll-behavior-x: contain;
    }

    #phoneGrid {
      display: grid;
      grid-template-columns: repeat(32, 56px);
      grid-template-rows: 56px;
      width: max-content;
      border: 2px solid var(--light);
      touch-action: manipulation;
    }

    .phone-pixel {
      width: 56px;
      height: 56px;
      padding: 0;
      border: 2px solid var(--dark);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .phone-pixel:active {
      transform: none;
      box-shadow: none;
      filter: brightness(.82);
    }

    .phone-pixel.on {
      border: 4px solid var(--ink);
    }

    .phone-now {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px;
      padding: 8px;
      border: 3px solid var(--ink);
      background: var(--cream);
      font-weight: 900;
      text-align: center;
    }

    @media (max-width: 820px) {
      .computer-layout { grid-template-columns: 1fr; }
      .side-panel { min-height: 0; }
      #qr { max-width: 220px; margin-inline: auto; }
      #sequencer { height: 48vh; min-height: 300px; }
    }

    @media (max-width: 420px) {
      .screen { padding: 8px; }
      .identity { grid-template-columns: 64px 1fr; }
      #identitySwatch { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>
  <main id="computer" class="screen hidden">
    <div class="status-row">
      <div id="computerStatus" class="status waiting" role="status">
        <span class="status-dot"></span><span id="computerStatusText">WAITING</span>
      </div>
      <button id="computerReconnect" type="button">RECONNECT</button>
    </div>
    <div class="computer-layout">
      <aside class="side-panel">
        <h1>Touching<br>Sounds</h1>
        <div id="qr" aria-label="Phone join QR code"></div>
        <button id="startSound" type="button">START SOUND</button>
        <a id="joinUrl" target="_blank" rel="noopener">JOIN URL</a>
        <div id="roster" class="roster"></div>
      </aside>
      <section class="main-panel">
        <header class="canvas-head">
          <strong>8 BARS / 120 BPM</strong>
          <span id="beatReadout">STEP 01</span>
        </header>
        <div id="canvasWrap">
          <canvas id="sequencer"></canvas>
        </div>
      </section>
    </div>
  </main>

  <main id="phone" class="screen phone-screen hidden">
    <div class="status-row">
      <div id="phoneStatus" class="status waiting" role="status">
        <span class="status-dot"></span><span id="phoneStatusText">WAITING</span>
      </div>
      <button id="phoneReconnect" type="button">RECONNECT</button>
    </div>
    <section class="phone-card">
      <header class="identity">
        <div id="identitySwatch"></div>
        <div>
          <h2 id="playerName">JOINING...</h2>
          <p id="soundName">WAITING FOR HOST</p>
          <p id="lineName">YOUR PIXEL LINE</p>
        </div>
      </header>
      <div class="phone-tools">
        <button id="clearMyPixels" type="button">CLEAR MY LINE</button>
        <button id="phoneStartSound" type="button">START</button>
      </div>
      <div class="phone-grid-wrap">
        <div id="phoneGrid" aria-label="My 32 pixel line"></div>
      </div>
      <div id="phoneNow" class="phone-now">WAITING FOR HOST</div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const COLS = 32;
      const ROWS = 16;
      const BPM = 120;
      const STEP_MS = 60000 / BPM / 2;
      const joinParam = new URLSearchParams(location.search).get("join");
      const isPhone = Boolean(joinParam);

      const PALETTE = [
        { name: "Coral", color: "#ef476f", sound: "Square", wave: "square" },
        { name: "Sun",   color: "#ffd166", sound: "Chiptune", wave: "sawtooth" },
        { name: "Mint",  color: "#06d6a0", sound: "Blip", wave: "square" },
        { name: "Sky",   color: "#118ab2", sound: "Sine Pulse", wave: "sine" },
        { name: "Violet", color: "#8357e5", sound: "Triangle", wave: "triangle" },
        { name: "Berry", color: "#f72585", sound: "Soft Square", wave: "square" },
        { name: "Orange", color: "#f8961e", sound: "Buzz", wave: "sawtooth" },
        { name: "Blue",  color: "#4361ee", sound: "Glass", wave: "triangle" }
      ];

      const PITCHES = [
        987.77,932.33,880,830.61,783.99,739.99,698.46,659.25,
        622.25,587.33,553.37,523.25,493.88,466.16,440,415.30
      ];

      function setStatus(side, state, text) {
        const status = document.getElementById(side + "Status");
        document.getElementById(side + "StatusText").textContent = text;
        status.className = "status " + state;
      }

      function send(connection, type, payload = {}) {
        if (!connection || connection.open !== true) return false;
        connection.send(JSON.stringify({ type, payload }));
        return true;
      }

      function listen(connection, handler) {
        connection.on("data", data => {
          try {
            const message = typeof data === "string" ? JSON.parse(data) : data;
            if (message?.type) handler(message);
          } catch (error) {
            console.warn("Invalid PeerJS message", error);
          }
        });
      }

      function randomPeerId() {
        return "touching-" + Math.random().toString(36).slice(2, 9) + "-" + Date.now().toString(36);
      }

      function waitForLibraries(callback) {
        if (window.Peer && (isPhone || window.QRCode)) {
          callback();
          return;
        }
        let attempts = 0;
        const timer = setInterval(() => {
          attempts++;
          if (window.Peer && (isPhone || window.QRCode)) {
            clearInterval(timer);
            callback();
          } else if (attempts >= 100) {
            clearInterval(timer);
            setStatus(isPhone ? "phone" : "computer", "disconnected", "LIBRARY FAILED");
          }
        }, 50);
      }

      if (isPhone) {
        document.getElementById("phone").classList.remove("hidden");
      } else {
        document.getElementById("computer").classList.remove("hidden");
      }

      /* Computer */
      const host = {
        peer: null,
        connections: new Map(),
        players: new Map(),
        grid: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
        playerCount: 0,
        step: 0,
        timer: null,
        audio: null,
        master: null,
        playing: false
      };

      const canvas = document.getElementById("sequencer");
      const ctx = canvas?.getContext("2d");

      function initHost() {
        buildHostCanvas();
        startHostSequencer();
        createHostPeer();
        document.getElementById("computerReconnect").addEventListener("click", reconnectHost);
        document.getElementById("startSound").addEventListener("click", startHostAudio);
        window.addEventListener("resize", drawHostCanvas);
      }

      function createHostPeer() {
        setStatus("computer", "waiting", "WAITING");
        host.peer = new Peer(randomPeerId(), {
          secure: location.protocol === "https:",
          debug: 1
        });

        host.peer.on("open", id => {
          const url = new URL(location.href);
          url.search = "";
          url.hash = "";
          url.searchParams.set("join", id);
          const joinUrl = url.toString();

          document.getElementById("qr").innerHTML = "";
          new QRCode(document.getElementById("qr"), {
            text: joinUrl,
            width: 220,
            height: 220,
            correctLevel: QRCode.CorrectLevel.M
          });
          const link = document.getElementById("joinUrl");
          link.href = joinUrl;
          link.textContent = joinUrl;
          if (!host.connections.size) setStatus("computer", "waiting", "WAITING");
        });

        host.peer.on("connection", connection => setupHostConnection(connection));
        host.peer.on("disconnected", () => setStatus("computer", "disconnected", "DISCONNECTED"));
        host.peer.on("error", error => {
          console.error("Host PeerJS error", error);
          setStatus("computer", "disconnected", "DISCONNECTED");
        });
      }

      function reconnectHost() {
        if (host.peer && !host.peer.destroyed) host.peer.destroy();
        host.connections.forEach(connection => connection.close());
        host.connections.clear();
        host.players.clear();
        host.playerCount = 0;
        host.grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        renderRoster();
        createHostPeer();
      }

      function setupHostConnection(connection) {
        const registerPlayer = () => {
          if (host.players.has(connection.peer)) return host.players.get(connection.peer);

          host.playerCount++;
          const assignedRow = (host.playerCount - 1) % ROWS;
          const colorIndex = (host.playerCount - 1) % PALETTE.length;
          const player = {
            id: connection.peer,
            name: "PLAYER " + host.playerCount,
            colorIndex,
            assignedRow,
            connected: true
          };

          host.connections.set(connection.peer, connection);
          host.players.set(connection.peer, player);
          setStatus("computer", "connected", "CONNECTED " + host.connections.size);
          renderRoster();
          return player;
        };

        const welcomePlayer = () => {
          if (connection.open !== true) return;
          const player = registerPlayer();
          if (!player) return;

          // This welcome message is the handshake that enables the phone.
          const sent = send(connection, "welcome", {
            player,
            grid: host.grid,
            cols: COLS,
            rows: ROWS,
            bpm: BPM
          });
          if (!sent) {
            setTimeout(welcomePlayer, 100);
          }
          broadcast("players", { players: Array.from(host.players.values()) });
        };

        registerPlayer();

        if (connection.open === true) {
          welcomePlayer();
        } else {
          connection.on("open", welcomePlayer);
        }

        listen(connection, message => {
          if (message.type === "hello" || message.type === "welcome_request") {
            welcomePlayer();
            return;
          }

          const player = host.players.get(connection.peer);
          if (!player) return;

          if (message.type === "pixel") {
            const { row, col, active } = message.payload || {};
            if (!Number.isInteger(row) || !Number.isInteger(col)) return;
            if (row !== player.assignedRow) return;
            if (col < 0 || col >= COLS) return;

            if (active) {
              host.grid[row][col] = { owner: connection.peer, colorIndex: player.colorIndex };
            } else if (host.grid[row][col]?.owner === connection.peer) {
              host.grid[row][col] = null;
            }
            broadcast("pixel", { row, col, active,
              owner: connection.peer, colorIndex: player.colorIndex });
          } else if (message.type === "clear") {
            clearPlayerLine(connection.peer);
          }
        });

        connection.on("close", () => removeHostConnection(connection.peer));
        connection.on("error", () => removeHostConnection(connection.peer));
      }

      function removeHostConnection(peerId) {
        host.connections.delete(peerId);
        host.players.delete(peerId);
        clearPlayerLine(peerId);
        renderRoster();

        if (host.connections.size) {
          setStatus("computer", "connected", "CONNECTED " + host.connections.size);
        } else {
          setStatus("computer", "waiting", "WAITING");
        }
        broadcast("players", { players: Array.from(host.players.values()) });
        broadcast("grid", { grid: host.grid });
      }

      function clearPlayerLine(peerId) {
        let changed = false;
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            if (host.grid[row][col]?.owner === peerId) {
              host.grid[row][col] = null;
              changed = true;
            }
          }
        }
        if (changed) broadcast("grid", { grid: host.grid });
      }

      function broadcast(type, payload) {
        host.connections.forEach(connection => send(connection, type, payload));
      }

      function renderRoster() {
        const roster = document.getElementById("roster");
        roster.innerHTML = "";
        host.players.forEach(player => {
          const item = document.createElement("div");
          item.className = "player-card";
          item.innerHTML =
            '<span class="swatch" style="background:' + PALETTE[player.colorIndex].color + '"></span>' +
            player.name + " / LINE " + (player.assignedRow + 1) + " / " +
            PALETTE[player.colorIndex].sound;
          roster.appendChild(item);
        });
      }

      function startHostAudio() {
        if (!host.audio) {
          host.audio = new (window.AudioContext || window.webkitAudioContext)();
          host.master = host.audio.createGain();
          host.master.gain.value = 0.22;
          host.master.connect(host.audio.destination);
        }
        if (host.audio.state === "suspended") host.audio.resume();
        host.playing = true;
        document.getElementById("startSound").textContent = "SOUND ON";
      }

      function playHostNote(row, colorIndex) {
        if (!host.audio || host.audio.state !== "running") return;
        const now = host.audio.currentTime;
        const oscillator = host.audio.createOscillator();
        const gain = host.audio.createGain();
        oscillator.type = PALETTE[colorIndex].wave;
        oscillator.frequency.setValueAtTime(PITCHES[row], now);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.7, now + .008);
        gain.gain.exponentialRampToValueAtTime(.0001, now + .14);
        oscillator.connect(gain);
        gain.connect(host.master);
        oscillator.start(now);
        oscillator.stop(now + .16);
      }

      function buildHostCanvas() {
        drawHostCanvas();
      }

      function drawHostCanvas() {
        if (!canvas || !ctx) return;
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const cellWidth = width / COLS;
        const cellHeight = height / ROWS;
        ctx.fillStyle = "#9bbc0f";
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = "#306230";
        ctx.lineWidth = 1;
        for (let col = 0; col <= COLS; col++) {
          ctx.beginPath();
          ctx.moveTo(Math.round(col * cellWidth) + .5, 0);
          ctx.lineTo(Math.round(col * cellWidth) + .5, height);
          ctx.stroke();
        }
        for (let row = 0; row <= ROWS; row++) {
          ctx.beginPath();
          ctx.moveTo(0, Math.round(row * cellHeight) + .5);
          ctx.lineTo(width, Math.round(row * cellHeight) + .5);
          ctx.stroke();
        }

        ctx.fillStyle = "#172c26";
        ctx.font = "bold 11px monospace";
        for (let bar = 0; bar < 8; bar++) {
          ctx.fillText(String(bar + 1).padStart(2, "0"), bar * 4 * cellWidth + 5, 13);
        }

        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const cell = host.grid[row][col];
            if (!cell) continue;
            ctx.fillStyle = PALETTE[cell.colorIndex].color;
            ctx.fillRect(col * cellWidth + 2, row * cellHeight + 2,
              Math.max(1, cellWidth - 4), Math.max(1, cellHeight - 4));
          }
        }

        ctx.fillStyle = "#172c26";
        ctx.fillRect(host.step * cellWidth - 2, 0, Math.max(4, cellWidth * .12), height);
        ctx.fillStyle = "#f3ecc7";
        ctx.fillRect(host.step * cellWidth + 1, 0, 2, height);
      }

      function startHostSequencer() {
        clearInterval(host.timer);
        host.timer = setInterval(() => {
          host.step = (host.step + 1) % COLS;
          if (host.playing) {
            for (let row = 0; row < ROWS; row++) {
              const cell = host.grid[row][host.step];
              if (cell) playHostNote(row, cell.colorIndex);
            }
          }
          document.getElementById("beatReadout").textContent =
            "STEP " + String(host.step + 1).padStart(2, "0");
          drawHostCanvas();
        }, STEP_MS);
      }

      /* Player */
      const player = {
        peer: null,
        connection: null,
        profile: null,
        grid: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
        assignedRow: 0,
        selectedStep: 0,
        audio: null,
        handshakeTimer: null
      };

      function initPlayer() {
        buildPhoneGrid();
        bindPhoneControls();
        createPlayerPeer();
      }

      function createPlayerPeer() {
        setStatus("phone", "waiting", "CONNECTING");
        if (player.peer && !player.peer.destroyed) player.peer.destroy();
        player.peer = new Peer(randomPeerId(), {
          secure: location.protocol === "https:",
          debug: 1
        });

        player.peer.on("open", () => connectToHost());
        player.peer.on("disconnected", () => setStatus("phone", "disconnected", "DISCONNECTED"));
        player.peer.on("error", error => {
          console.error("Player PeerJS error", error);
          setStatus("phone", "disconnected", "DISCONNECTED");
        });
      }

      function connectToHost() {
        setStatus("phone", "waiting", "CONNECTING");
        clearInterval(player.handshakeTimer);
        player.profile = null;
        player.connection = player.peer.connect(joinParam, {
          reliable: true
        });

        player.connection.on("open", () => {
          setStatus("phone", "waiting", "WAITING FOR HOST");
          send(player.connection, "hello");
          clearInterval(player.handshakeTimer);
          player.handshakeTimer = setInterval(() => {
            if (player.profile) {
              clearInterval(player.handshakeTimer);
              return;
            }
            send(player.connection, "hello");
          }, 750);
        });

        listen(player.connection, message => {
          if (message.type === "welcome") {
            applyWelcome(message.payload);
          } else if (message.type === "grid") {
            player.grid = message.payload.grid;
            renderPhoneGrid();
          } else if (message.type === "pixel") {
            const p = message.payload;
            if (p.active) {
              player.grid[p.row][p.col] = { owner: p.owner, colorIndex: p.colorIndex };
            } else {
              player.grid[p.row][p.col] = null;
            }
            renderPhoneGrid();
          }
        });

        player.connection.on("close", () => setStatus("phone", "disconnected", "DISCONNECTED"));
        player.connection.on("error", () => setStatus("phone", "disconnected", "DISCONNECTED"));
      }

      function applyWelcome(payload) {
        player.profile = payload.player;
        player.assignedRow = payload.player.assignedRow;
        player.grid = payload.grid;
        clearInterval(player.handshakeTimer);
        const palette = PALETTE[player.profile.colorIndex];

        document.getElementById("identitySwatch").style.background = palette.color;
        document.getElementById("playerName").textContent = player.profile.name;
        document.getElementById("soundName").textContent = palette.sound + " SOUND";
        document.getElementById("lineName").textContent =
          "YOUR LINE " + String(player.assignedRow + 1).padStart(2, "0");
        document.getElementById("phoneNow").textContent =
          "CONNECTED - TAP A PIXEL";
        setStatus("phone", "connected", "CONNECTED");
        renderPhoneGrid();
      }

      function bindPhoneControls() {
        document.getElementById("phoneReconnect").addEventListener("click", () => {
          clearInterval(player.handshakeTimer);
          player.profile = null;
          if (player.connection) player.connection.close();
          createPlayerPeer();
        });
        document.getElementById("clearMyPixels").addEventListener("click", () => {
          send(player.connection, "clear");
        });
        document.getElementById("phoneStartSound").addEventListener("click", () => {
          const Context = window.AudioContext || window.webkitAudioContext;
          if (Context && !player.audio) player.audio = new Context();
          if (player.audio?.state === "suspended") player.audio.resume();
          document.getElementById("phoneStartSound").textContent = "READY";
        });
      }

      function buildPhoneGrid() {
        if (!isPhone) return;
        const grid = document.getElementById("phoneGrid");
        grid.innerHTML = "";
        for (let col = 0; col < COLS; col++) {
          const pixel = document.createElement("button");
          pixel.type = "button";
          pixel.className = "phone-pixel";
          pixel.setAttribute("aria-label", "Step " + (col + 1));
          pixel.addEventListener("click", () => togglePhonePixel(col));
          grid.appendChild(pixel);
        }
      }

      function togglePhonePixel(col) {
        if (!player.profile) {
          document.getElementById("phoneNow").textContent = "WAITING FOR HOST";
          return;
        }
        const row = player.assignedRow;
        const existing = player.grid[row]?.[col];
        const active = existing?.owner !== player.profile.id;

        send(player.connection, "pixel", { row, col, active });

        if (active) {
          player.grid[row][col] = {
            owner: player.profile.id,
            colorIndex: player.profile.colorIndex
          };
        } else {
          player.grid[row][col] = null;
        }
        player.selectedStep = col;
        renderPhoneGrid();

        const palette = PALETTE[player.profile.colorIndex];
        document.getElementById("phoneNow").textContent =
          (active ? "ADDED" : "REMOVED") + " " + palette.sound +
          " / " + PITCHES[row].toFixed(1) + " Hz / STEP " +
          String(col + 1).padStart(2, "0");
      }

      function renderPhoneGrid() {
        if (!isPhone) return;
        const pixels = document.getElementById("phoneGrid").children;
        const row = player.assignedRow;
        for (let col = 0; col < COLS; col++) {
          const pixel = pixels[col];
          const cell = player.grid[row]?.[col];
          pixel.classList.toggle("on", Boolean(cell));
          pixel.style.background = cell
            ? PALETTE[cell.colorIndex].color
            : "transparent";
        }
      }

      waitForLibraries(() => {
        if (isPhone) initPlayer();
        else initHost();
      });
    })();
  </script>
</body>
</html>
